
name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "tourism_project/deployment/best_model.pkl"
      - "tourism_project/deployment/feature_columns.json"

permissions:
  contents: write


# ==========================================================
# Job 1: Data Registration
# ==========================================================

jobs:

  data-registration:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt

      - name: Register and validate data
        run: |
          python tourism_project/model_building/data_register.py


  # ==========================================================
  # Job 2: Data Preparation
  # ==========================================================

  data-preparation:
    runs-on: ubuntu-latest
    needs: data-registration

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt

      - name: Prepare training and testing data
        run: |
          python tourism_project/model_building/prep.py

      - name: Upload train-test data artifact
        uses: actions/upload-artifact@v4
        with:
          name: train-test-data
          path: |
            tourism_project/model_building/Xtrain.csv
            tourism_project/model_building/Xtest.csv
            tourism_project/model_building/ytrain.csv
            tourism_project/model_building/ytest.csv
            tourism_project/model_building/feature_columns.json


  # ==========================================================
  # Job 3: Model Training and Experimentation
  # ==========================================================

  model-training:
    runs-on: ubuntu-latest
    needs: data-preparation

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt

      - name: Download train-test data artifact
        uses: actions/download-artifact@v4
        with:
          name: train-test-data
          path: tourism_project/model_building

      - name: Train and evaluate model
        run: |
          python tourism_project/model_building/train.py

      - name: Verify trained model
        run: |
          test -f tourism_project/deployment/best_model.pkl
          test -f tourism_project/deployment/feature_columns.json
          echo "Trained model files verified successfully."

      - name: Commit and push trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tourism_project/deployment/best_model.pkl
          git add tourism_project/deployment/feature_columns.json

          if git diff --cached --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "Update trained model"
            git push origin main
          fi


  # ==========================================================
  # Job 4: Deployment Validation
  # ==========================================================

  deployment-validation:
    runs-on: ubuntu-latest
    needs: model-training

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate Streamlit application
        run: |
          python -m py_compile tourism_project/deployment/app.py

      - name: Deployment validation successful
        run: |
          echo "Streamlit application validation completed successfully."
